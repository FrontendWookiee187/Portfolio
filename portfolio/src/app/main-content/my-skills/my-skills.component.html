<section class="mySkills" id="mySkills">

        <h1>{{ 'mySkills.title' | translate }}</h1>
<div class="content-wrapper">

    <div class="mySkillsContent">

        

        <div class="skillSet">
            @for (skill of skills; track skill.name) {
                <div class="skillItem">
                    <img [src]="skill.image" [alt]="skill.name">
                    <span class="skillName">{{ skill.name }}</span>
                </div>
            }
        </div>
        
        <div class="currentlyLearning">
            <img class="bubble" src="assets/img/myskills/Skill Ellipse.png" alt="">
            <div class="currentlyLearningText">
                <div class="learningTitle">{{ 'mySkills.learningTitle' | translate }}</div>
                <div class="learningContent">
                    <div class="learningBubble">
                        <div class="learningIcons">
                            @for (skill of skills.slice(0, 3); track skill.name) {
                                <div class="learningSkillItem">
                                    <img [src]="skill.image" [alt]="skill.name">
                                    <span class="learningSkillName">{{ skill.name }}</span>
                                </div>
                            }
                        </div>
                    </div>
                    <div class="learningDescription">
                        <span>{{ 'mySkills.currentlyLearning' | translate }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Contact Button -->
        <div class="mobileContactButton">
            <button class="letsTalkBtn">{{ 'mySkills.letsTalk' | translate }}</button>
        </div>



    </div>








</div>

</section>
